{% extends 'layout.html' %}

{% block title %}{{ quiz.name }} - Result{% endblock %}

{% block content %}

    <p>Result: {{ quiz_detail.result }}%</p>
    <p>Reward: {{ quiz_detail.get_reward_display }}</p>
    <a href="{% url 'quiz:quizzes' %}">Back to my quizzes</a>
{% endblock %}
