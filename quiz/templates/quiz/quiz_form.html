{% extends 'layout.html' %}

{% block title %}{{ quiz.name }}{% endblock %}

{% block content %}
    <h1>{{ quiz.name }}</h1>

    <form method="post">
        {% csrf_token %}
        {% for question in questions %}
            <fieldset>
                <legend>{{ question.text }}</legend>
                <label>
                    <input type="radio" name="question-{{ question.id }}" value="1" required> {{ question.answ1 }}
                </label><br>
                <label>
                    <input type="radio" name="question-{{ question.id }}" value="2" required> {{ question.answ2 }}
                </label><br>
                <label>
                    <input type="radio" name="question-{{ question.id }}" value="3" required> {{ question.answ3 }}
                </label>
            </fieldset>
        {% empty %}
            <p>This quiz has no questions yet.</p>
        {% endfor %}

        {% if questions %}
            <button type="submit">Submit</button>
        {% endif %}
    </form>
{% endblock %}
