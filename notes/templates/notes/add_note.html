{% extends 'layout.html' %}

{% block title %}Add Note{% endblock %}

{% block content %}
    <h2>New Note</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save Note</button>
    </form>
    <a href="{% url 'notes:view_notes' %}">Back to Notes</a>
{% endblock %}
